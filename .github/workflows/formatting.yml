name: Formatting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  formatting:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sivakov512/esp-idf:v6.1.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check code formatting
        run: make check-format
